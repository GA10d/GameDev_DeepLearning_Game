<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Learning Foundry 0.5 · Unity实际关卡</title><style>
*{box-sizing:border-box}body{margin:0;background:#171f1b;color:#d8d7bf;font:16px/1.6 system-ui,"Microsoft YaHei",sans-serif}header{padding:14px 22px;border-bottom:1px solid #596653}h1{margin:0;font-size:21px}header p{margin:4px 0;font-size:14px;color:#aeb7a0}main{display:grid;grid-template-columns:245px 1fr;gap:18px;padding:18px;max-width:1900px;margin:auto}nav{max-height:82vh;overflow:auto}button{display:block;width:100%;background:#26372b;color:inherit;border:1px solid #53624b;text-align:left;padding:9px 12px;margin-bottom:6px;cursor:pointer;font:inherit}button[aria-current=true]{background:#704522;border-color:#c09052}figure{margin:0}img{width:100%;height:auto;display:block;background:#111}h2{font-size:20px;margin:12px 0 3px}figcaption p{margin:4px 0;color:#bcc4ae;font-size:15px}a{color:#cbca8e} @media(max-width:900px){main{grid-template-columns:1fr}nav{display:flex;max-height:160px;flex-wrap:wrap;gap:5px}button{width:auto}}
</style><header><h1>Learning Foundry · 0.5.0 完整路线试玩</h1><p>55关首轮可玩原型 · 下方为实际Windows Unity程序渲染，非网页模拟 · CPU真实MNIST训练</p><a href="campaign-playable-v05.md">逐关操作与实际边界</a> · <a href="level-map.html">关卡树</a></header><main><nav id="levels"></nav><figure><img id="frame" alt="Unity实际关卡"><figcaption><h2 id="title"></h2><p id="concept"></p><p id="goal"></p></figcaption></figure></main><script>
const frames=[{"id": "C01", "title": "直线到不了的地方", "concept": "线性模型的表达能力限制", "objective": "这是诊断关：线性模型无需解出 XOR。观察全部4点，调权重记录两条不同边界；每条都应有错点。", "file": "../verification/campaign-0.5.0/C01.png"}, {"id": "C02", "title": "让信号有一个折点", "concept": "ReLU 的分段行为", "objective": "安装正值闸门：[-2,0,3] → [0,0,3]，另一组输入也要成立。", "file": "../verification/campaign-0.5.0/C02.png"}, {"id": "C03", "title": "中间表示工作台", "concept": "隐藏层形成中间表示", "objective": "串联两个 Dense：先宽度2，权重 [1,0,0,1]；再宽度1，权重 [2,-1]，偏置 [0.5]。观察中间坐标，最终 y=2x−z+0.5。", "file": "../verification/campaign-0.5.0/C03.png"}, {"id": "C04", "title": "折点怎样参加学习", "concept": "ReLU 的反向规则", "objective": "安装梯度闸门，设置 g=3。正数回3，负数与零回0；验收还会检查 g=−2。", "file": "../verification/campaign-0.5.0/C04.png"}, {"id": "C05", "title": "非线性分拣站", "concept": "隐藏层与非线性共同提供表达能力", "objective": "自行安装 Dense→ReLU→Dense，末层宽度2。推荐隐藏宽度8、学习率0.12。实际训练后 XOR 四点全部正确。", "file": "../verification/campaign-0.5.0/C05.png"}, {"id": "D01", "title": "把信号装成一排", "concept": "向量作为一组数", "objective": "安装打包→拆包，保持三个元素顺序。切换两组样本，选中元素查看对应。", "file": "../verification/campaign-0.5.0/D01.png"}, {"id": "D02", "title": "形状拼图", "concept": "形状与重排", "objective": "安装两个形状转接器：[2,3]→[6]→[2,3]。另外尝试 [5]，记录元素数不符的报错，再修复。", "file": "../verification/campaign-0.5.0/D02.png"}, {"id": "D03", "title": "向量混合器", "concept": "点积", "objective": "用逐项乘法的权重 [2,-1,0.5] 接求和器，构成点积。切换输入，并检查非单位回流。", "file": "../verification/campaign-0.5.0/D03.png"}, {"id": "D04", "title": "一排计算单元", "concept": "矩阵乘法组合多个输出", "objective": "安装转置→矩阵乘法。转置 [2,3]→[3,2]；乘法宽度2，权重 [1,0,0,2]。检查回流。", "file": "../verification/campaign-0.5.0/D04.png"}, {"id": "D05", "title": "全连接积木", "concept": "Dense 层参数化封装", "objective": "安装 Dense 宽度2，权重 [1,0,0,0,1,0]，偏置 [0.5,-0.5]。送样与回流，再保存/复制，确认副本参数独立。", "file": "../verification/campaign-0.5.0/D05.png"}, {"id": "D06", "title": "一批物品一起学", "concept": "批次与平均梯度", "objective": "安装平均归约。检查 [2,3] 的6项均值；对非单位梯度观察每项 g/6，与逐项累加一致。", "file": "../verification/campaign-0.5.0/D06.png"}, {"id": "E01", "title": "留一些物品来验收", "concept": "训练集与验证集的用途", "objective": "数据柜有训练集、验证集、密封测试集。打开训练与验证抽屉，各测量一次；测试集必须保持封存。", "file": "../verification/campaign-0.5.0/E01.png"}, {"id": "E02", "title": "十个出口的分数", "concept": "多分类输出向量", "objective": "安装最大值判别，观察10个类别分数。验收包含负分数与并列，后者取第一个。", "file": "../verification/campaign-0.5.0/E02.png"}, {"id": "E03", "title": "把分数放到同一把尺上", "concept": "Softmax 将分数转为类别概率", "objective": "安装概率刻度。送入不同分数，包括1000分的并列；比较整体加常数后的输出。", "file": "../verification/campaign-0.5.0/E03.png"}, {"id": "E04", "title": "自信地答错有多糟", "concept": "交叉熵评价真实类别概率", "objective": "原始分数直接接分类误差计，真标签5。观察自信正确/犹豫/自信错误三组误差与概率减标签的回流。", "file": "../verification/campaign-0.5.0/E04.png"}, {"id": "E05", "title": "第一台数字读取器", "concept": "全连接网络的十分类基础方案", "objective": "从28×28灰度图开始，安装展平→Dense→ReLU→Dense(10)。训练集2000件，固定验证2000件。真实验证达到85%，保存检查点。", "file": "../verification/campaign-0.5.0/E05.png"}, {"id": "E06", "title": "找出经常错的笔迹", "concept": "通过错误样本诊断模型", "objective": "在固定验证集上生成混淆矩阵。选中一个有错例的格子查看图像；改变配置并保存两次实测记录比较。", "file": "../verification/campaign-0.5.0/E06.png"}, {"id": "F01", "title": "看一小块图像", "concept": "局部窗口的加权计算", "objective": "安装窗口点积，3×3右减左固定核。点击特征图不同格子，观察对应九个像素；切换两张图。", "file": "../verification/campaign-0.5.0/F01.png"}, {"id": "F02", "title": "让窗口走遍图像", "concept": "卷积窗口扫描形成特征图", "objective": "安装滑动扫描，固定3×3右减左核。逐格移动窗口，观察完整6×6响应图。", "file": "../verification/campaign-0.5.0/F02.png"}, {"id": "F03", "title": "同一套权重到处用", "concept": "卷积的权重共享与梯度汇总", "objective": "安装 Conv2D：1通道、3×3核、步幅1、填充0。检查核与输入的数值梯度，尤其重叠窗口的相加。", "file": "../verification/campaign-0.5.0/F03.png"}, {"id": "F04", "title": "多种眼光看图像", "concept": "多个卷积核与通道", "objective": "输入2通道。安装输出2通道的 Conv2D，3×3核。切换输出通道观察不同响应，再检查各自权重与偏置回流。", "file": "../verification/campaign-0.5.0/F04.png"}, {"id": "F05", "title": "步幅与边界", "concept": "卷积步幅和 padding 改变输出尺寸", "objective": "8×8输入，3×3卷积、输出1通道。设置步幅2、填充1；先填写预测输出形状 [1,1,4,4] 再测量。", "file": "../verification/campaign-0.5.0/F05.png"}, {"id": "F06", "title": "四个数选一个", "concept": "最大池化的局部汇聚", "objective": "安装2×2最大池化，步幅2。全部负数的窗口也取正确最大值，输出2×2。", "file": "../verification/campaign-0.5.0/F06.png"}, {"id": "F07", "title": "选中的数接回梯度", "concept": "最大池化的梯度路径", "objective": "安装2×2最大池化，步幅2。检查上游g=3的回流，第三张图包含并列最大值，只流回首个位置。", "file": "../verification/campaign-0.5.0/F07.png"}, {"id": "F08", "title": "把特征交给分类器", "concept": "空间特征与分类向量的接口", "objective": "安装展平器。[1,1,8,8]→[1,64]；验收还含批量2与通道2，批量轴不能混进特征。", "file": "../verification/campaign-0.5.0/F08.png"}, {"id": "F09", "title": "封装视觉积木", "concept": "可配置视觉模块组合", "objective": "安装 Conv(2通道,3×3)→ReLU→MaxPool(2×2,步幅2)。封装为视觉积木，保存并复制；展开核对前向与回流。", "file": "../verification/campaign-0.5.0/F09.png"}, {"id": "G01", "title": "准备最后一批数据", "concept": "完整训练任务的数据流程", "objective": "将训练抽屉扩为10000件，验证仍为原来的2000件。核对图像0～1、标签0～9；独立测试保持封存。", "file": "../verification/campaign-0.5.0/G01.png"}, {"id": "G02", "title": "拼出自己的读取器", "concept": "完整模型结构设计", "objective": "自由组合一个可训练的10分类器，参数≤50000。至少保存两种不同结构；可用Dense，也可加入视觉积木。", "file": "../verification/campaign-0.5.0/G02.png"}, {"id": "G03", "title": "让读取器学会数字", "concept": "在预算内训练并用验证反馈迭代", "objective": "用同一数据、种子、学习率与步数比较两种结构。训练和验证曲线同时记录，固定验证达到90%，保存模型。训练可暂停续跑。", "file": "../verification/campaign-0.5.0/G03.png"}, {"id": "G04", "title": "邮政站正式开机", "concept": "独立验收与实际使用", "objective": "冻结当前参数，再首次打开官方独立测试集。测试达到88%；在手写板上画一个数字，查看28×28输入与推理结果，再导出模型。", "file": "../verification/campaign-0.5.0/G04.png"}, {"id": "S01", "title": "同样结果更少部件", "concept": "代数等价与构建优化", "objective": "这条设备有3个逐项乘法，其中2个是多余的。把它缩成1个、系数[2,2,2]，新输入结果保持相同。", "file": "../verification/campaign-0.5.0/S01.png"}, {"id": "S02", "title": "让步子记住方向", "concept": "动量优化的状态", "objective": "动量是带记忆的更新：v=0.8v+g，w=w−0.1v。实验台可切换SGD/动量。观察并保存两条真实轨迹，再填写第2步动量参数值。", "file": "../verification/campaign-0.5.0/S02.png"}, {"id": "S03", "title": "半月港湾", "concept": "非线性结构的迁移", "objective": "安装2类 Dense→ReLU→Dense，隐藏宽度可调。训练固定种子双月，独立噪声验证准确率达到95%，查看弯曲边界。", "file": "../verification/campaign-0.5.0/S03.png"}, {"id": "S04", "title": "不同量纲的传感器", "concept": "输入归一化", "objective": "安装标准化，点击‘拟合训练刻度’。仅用训练四行拟合均值/总体标准差；第三列恒定7，以标准差1保护。验证沿用同一刻度。", "file": "../verification/campaign-0.5.0/S04.png"}, {"id": "S05", "title": "背下练习册的机器", "concept": "过拟合与早停", "objective": "用96件训练数据观察过拟合，固定2000件验证。记录至少三个不同步数的检查点，再按验证误差选择较早检查点进行比较。", "file": "../verification/campaign-0.5.0/S05.png"}, {"id": "S06", "title": "轻装上岗", "concept": "表现与模型规模的权衡", "objective": "用 Dense 层搭一个小于原机参数量的分类器，相同2000件训练与固定验证，达到80%。保存与原机实测比较。", "file": "../verification/campaign-0.5.0/S06.png"}, {"id": "S07", "title": "让区域一起说话", "concept": "平均池化及其反向分配", "objective": "安装2×2平均池化，步幅2，检查非单位回流均分。再与最大池化对极端像素的响应比较。", "file": "../verification/campaign-0.5.0/S07.png"}, {"id": "S08", "title": "研究工坊开放", "concept": "新的输入分布与开放实验", "objective": "保存至少4件个人训练笔迹、2件独立验证笔迹，分别标注标签。冻结原机记录个人验证，微调≥20步后再次记录比较；测试笔迹不进入更新。", "file": "../verification/campaign-0.5.0/S08.png"}, {"id": "手写板", "title": "实际笔迹输入与推理", "concept": "缩放、重心居中、推理", "objective": "原生DigitPad接收笔画，再由真实模型推理；此图为测试笔迹，不要求任意笔迹100%识别。", "file": "../verification/campaign-0.5.0/G04-drawing.png"}, {"id": "首次路线", "title": "首次路线", "concept": "原有流程回归", "objective": "实际Unity原生画面。原有接线、教程和右键自由平移继续可用。", "file": "../verification/ui-0.5.0/09-first-run-route.png"}, {"id": "旧工作台", "title": "旧工作台", "concept": "原有流程回归", "objective": "实际Unity原生画面。原有接线、教程和右键自由平移继续可用。", "file": "../verification/ui-0.5.0/03-workshop.png"}, {"id": "画布平移", "title": "画布平移", "concept": "原有流程回归", "objective": "实际Unity原生画面。原有接线、教程和右键自由平移继续可用。", "file": "../verification/ui-0.5.0/17-pan-after.png"}];const nav=document.getElementById('levels');function show(index){let f=frames[index];document.getElementById('frame').src=f.file;document.getElementById('title').textContent=f.id+' '+f.title;document.getElementById('concept').textContent='知识点：'+f.concept;document.getElementById('goal').textContent=f.objective;[...nav.children].forEach((b,i)=>b.setAttribute('aria-current',i===index));}frames.forEach((f,i)=>{let b=document.createElement('button');b.textContent=f.id+' '+f.title;b.onclick=()=>show(i);nav.append(b)});show(frames.findIndex(f=>f.id==='G03'));
</script></html>
